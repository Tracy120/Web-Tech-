<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-box">
        <h1>Search</h1>
        <p class="subtitle">Assignment 2 - Google Search</p>

        <form method="GET" action="redirect">
          <div class="input-box">
            <input
              type="text"
              name="query"
              placeholder="What do you want to find?"
              required
            />
          </div>

          <button type="submit" class="btn">Fetch</button>
        </form>
      </div>
    </div>
  </body>
</html>
